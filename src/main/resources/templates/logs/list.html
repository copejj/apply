<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz" layout:decorate="~{layout/default}">
	<body>
        <div layout:fragment="content"> 
            <div th:replace="~{fragments/forms :: direct-button(url='/logs/create', text='Add New Application')}"></div>
            <div class='filter-box' th:if="${selectedWeek != null or selectedCompany != null}">
                <span class="title">Active Filters:</span>
                <span class="clear-button" th:if="${selectedCompany != null}">
                    <a th:href="@{/logs/list(weekId=${selectedWeek})}" style="text-decoration: none;"> 
                        <span>Company</span>
                        <i class="fa-solid fa-x"></i> 
                    </a>
                </span>
                <span class="clear-button" th:if="${selectedWeek != null}">
                    <a th:href="@{/logs/list(companyId=${selectedCompany})}" style="text-decoration: none;">
                        <span>Week</span>
                        <i class="fa-solid fa-x"></i>
                    </a>
                </span>
                <span class="clear-button" >
                    <a th:href="@{/logs/list}" style="text-decoration: none;"> 
                        <span>Clear ALL</span>
                        <i class="fa-solid fa-x"></i> 
                    </a>
                </span>
            </div>
            <table id="logsTable" class="datatables table table-striped table-hover" style="display:none;">
                <thead>
                    <tr>
                        <th th:text="${labelSettings['week_start']}">week start</th>
                        <th th:text="${labelSettings['week_end']}">week end</th>
                        <th th:text="${labelSettings['action_date']}">action date</th>
                        <th th:text="${labelSettings['company_name']}">company name</th>
                        <th th:text="${labelSettings['title']}">title</th>
                        <th th:text="${labelSettings['current_status']}">current status</th>
                        <th th:text="${labelSettings['job_number']}">job number</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logs}">
                        <td>
                            <a th:href="@{/logs/details(weekId=${log.weekId})}" 
                                title="View weeks application details" 
                                style="text-decoration: none;"
                                class="text-secondary p-0">
                                <i class="fa-solid fa-square-poll-horizontal"></i>
                            </a>
                            <a th:href="@{/logs/list(companyId=${selectedCompany}, weekId=${selectedWeek == log.weekId ? '' : log.weekId})}" 
                                th:classappend="${selectedWeek == log.weekId? 'active-filter' : ''}"
                                style="text-decoration: none;"
                                class="text-secondary p-0"
                                title="Click to filter on this week or click again to clear">
                                <i class="fa-solid fa-filter"></i>
                            </a>
                            <span th:text="${log.startDate}"></span>
                        </td>
                        <td th:text="${log.endDate}"></td>
                        <td th:text="${log.actionDate}"></td>
                        <td>
                            <a th:href="@{/companies/edit/{id}(id=${log.companyId})}"
                                style="text-decoration: none;"
                                title="Edit this company">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>
                            <a th:href="@{/logs/list(
                                    companyId=${selectedCompany == log.companyId ? '' : log.companyId}, 
                                    weekId=${selectedWeek}
                                )}" 
                                th:classappend="${selectedCompany == log.companyId ? 'active-filter' : ''}"
                                style="text-decoration: none;"
                                title="Click to filter on this company or click again to clear">
                                <i class="fa-solid fa-filter"></i>
                            </a>
                            <span th:text="${log.companyName}"></span>
                        </td>
                        <td>
                            <a th:href="@{/logs/edit/{id}(id=${log.logId})}"><i class="fa-solid fa-pen-to-square"></i></a>
                            <span th:text="${log.title}"></span>
                        </td>
                        <td th:data-order="${log.latestStatus != null ? log.latestStatus.status : ''}"
                            th:data-search="${log.latestStatus != null ? log.latestStatus.status : ''}">
                            <span th:text="${log.latestStatus != null ? log.latestStatus.status : ''}" style="display:none;"></span>
                            <select class="form-select form-select-sm py-0 status-dropdown" 
                                    th:data-log-id="${log.logId}"
                                    style="width: 100%; height: auto; font-size: 0.875rem;">
                                <option value="" th:selected="${log.latestStatus == null}">[ Select Status ]</option>
                                <option th:each="status : ${allStatuses}" 
                                        th:value="${status.statusId}" 
                                        th:text="${status.status}"
                                        th:selected="${log.latestStatus != null && log.latestStatusId == status.statusId}">
                                </option>
                            </select>
                        </td>
                        <td th:text="${log.jobNumber}"></td>
                    </tr>
                </tbody>
            </table>
            <script>
                $(document).ready(function () {
                    $('#logsTable').DataTable({
                        "pageLength": 25,
                        "lengthMenu": [ [10, 25, 50, -1], [10, 25, 50, "All"] ],
                        "paging": true,
                        "lengthChange": true,
                        "searching": true,
                        "ordering": true,
                        "info": true,
                        "autoWidth": false,
                        "order": [{ "idx": 1, "dir": 'desc' }, { "idx": 2, "dir": 'asc' }], 
                        "responsive": true,
                        initComplete: function() {
                            $(this).addClass('d-some');
                        }
                    });
                });
                
                document.addEventListener('DOMContentLoaded', function () {
                    const table = document.getElementById('logsTable');
                    if (table) {
                        table.addEventListener('change', function (event) {
                            if (event.target && event.target.classList.contains('status-dropdown')) {
                                const dropdown = event.target;
                                const logId = dropdown.getAttribute('data-log-id');
                                const statusId = dropdown.value;

                                const selectedText = dropdown.options[dropdown.selectedIndex].text;
                                const newStatusText = dropdown.value === "" ? "" : selectedText;

                                fetch('/logs/update-status', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/x-www-form-urlencoded',
                                        'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content
                                    },
                                    body: new URLSearchParams({
                                        'logId': logId,
                                        'statusId': statusId
                                    })
                                })
                                .then(response => {
                                    if (response.ok) {
                                        dropdown.style.borderColor = '#198754';
                                        setTimeout(() => dropdown.style.borderColor = '', 1500);

                                        const cellElement = dropdown.closest('td');
                                        
                                        cellElement.setAttribute('data-search', newStatusText);
                                        cellElement.setAttribute('data-order', newStatusText);
                                        
                                        const hiddenSpan = cellElement.querySelector('span');
                                        if (hiddenSpan) hiddenSpan.textContent = newStatusText;

                                        if ($.fn.DataTable.isDataTable('#logsTable')) {
                                            const dtTable = $('#logsTable').DataTable();
                                            
                                            // Find the exact DataTables row and column indexes
                                            const rowIndex = dtTable.row(dropdown.closest('tr')).index();
                                            const colIndex = dtTable.column(cellElement).index();
                                            
                                            // Invalidate the specific cell and the row index structure
                                            dtTable.cell(rowIndex, colIndex).invalidate();
                                            dtTable.rows().invalidate();
                                        }
                                    } else {
                                        alert('Failed to save status. Reloading page to reset...');
                                        window.location.reload();
                                    }
                                })
                                .catch(error => {
                                    console.error('Error saving status:', error);
                                    alert('A connection error occurred. Status not saved.');
                                });
                            }
                        });
                    }
                });
            </script>
		</div>
	</body>
</html>
