<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz" 
      layout:decorate="~{layout/default}">
<body>
<div layout:fragment="content" class="mp-4">
    <div class="d-flex flex-wrap gap-4"> 
        <div th:each="log, iterStat : ${logs}" th:remove="tag"> 
            <div th:replace="~{fragments/details-row :: detailsCompany(log=${log}, iterStat=${iterStat})}"></div> 
        </div> 
    </div>

    <script th:src="@{/js/logs.js}"></script>
</div>
</body>
</html>
