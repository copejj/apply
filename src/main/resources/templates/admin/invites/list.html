<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz" xmlns:sec="http://www.thymeleaf.org" layout:decorate="~{layout/default}" th:with="isNarrow=true">
<body>
    <main layout:fragment="content">
		<div th:replace="~{fragments/forms :: open-button(targetId='addInviteForm', text='Add New Invite')}"></div>

		<div sec:authorize="hasRole('ADMIN')" id="addInviteForm" class="collapse mb-4">
			<div class="card card-body shadow-sm">
				<form th:action="@{/admin/invite/save}" th:object="${newInvite}" th:data-auto-show="${#fields.hasAnyErrors()}" method="post" class="row g-3">
					<div class="col-md-3">
						<input type="text" th:field="*{firstName}" class="form-control" placeholder="First Name" required>
					</div>
					<div class="col-md-3">
						<input type="text" th:field="*{lastName}" class="form-control" placeholder="Last Name" required>
					</div>
					<div class="col-md-3">
						<input type="text" th:field="*{email}" 
							class="form-control" 
							th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" 
							placeholder="Email" required>
						<div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
							Email Error Message
						</div>
					</div>
					<div class="col-md-2">
						<button type="submit" class="btn btn-success w-100">Save</button>
					</div>
				</form>
			</div>
		</div>

		<table id="configTable" data-admin-table="invites" class="datatables table table-striped table-hover stripe" style="display:none;">
			<thead>
				<tr>
					<th sec:authorize="hasRole('ADMIN')"></th>
					<th th:text="${labelSettings['first_name']}">first name</th>
					<th th:text="${labelSettings['last_name']}">last name</th>
					<th th:text="${labelSettings['user_email']}">email</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="invite : ${invites}">
					<td sec:authorize="hasRole('ADMIN')">
						<form th:action="@{/admin/invite/delete/{id}(id=${invite.inviteId})}" method="post" class="d-inline">
							<button type="button"
									style="background: none; border: none; padding: 0; cursor: pointer; color: #dc3545;"
									data-confirm-submit="Are you sure? This will permanently delete this invite.">
								<i class="fa-solid fa-x"></i>
							</button>
						</form>
					</td>
					<td th:text="${invite.firstName}"></td>
					<td th:text="${invite.lastName}"></td>
					<td th:text="${invite.email}"></td>
					<td>
						<span th:if="${invite.userId != null}" class="badge bg-success">
							Invite Accepted
						</span>

						<!-- Case 2: Invite is still pending (userId is null) -->
						<button th:unless="${invite.userId != null}"
								type="button"
								class="btn btn-outline-primary btn-sm" 
								th:data-name="${invite.firstName + ' ' + invite.lastName}"
								th:data-key="${invite.key}"
								data-copy-invite="true">
							<i class="fa-solid fa-copy"></i> Copy Email Body
						</button>
					</td>
				</tr>
			</tbody>
		</table>

		<script th:src="@{/js/admin.js}"></script>
    </main>
</body>
