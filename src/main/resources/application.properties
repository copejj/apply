spring.application.name=spring
spring.profiles.active=dev

# Explicit driver definition (optional in modern Spring Boot)
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# Automatically creates/updates the database schema based on your entities
# Options: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries to the console for debugging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONNECTION POOLING (HikariCP)
# ===============================
# Optional: Fine-tune the default connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000

spring.config.import=optional:classpath:secrets.properties,optional:file:/var/www/job-logs-secrets.properties

spring.mvc.hiddenmethod.filter.enabled=true

# Exposes the health endpoint (default is usually enough)
management.endpoints.web.exposure.include=health

# Recommended: Hide sensitive details from public view in production
management.endpoint.health.show-details=never

server.servlet.session.cookie.name=APPLOG_JSESSIONID
server.servlet.session.cookie.path=/

server.address=127.0.0.1
server.port=8080

management.info.git.mode=full
management.endpoints.web.exposure.exclude=info
